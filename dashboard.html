<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Dashboard</title>
<style>
/* ===================== Reset & Base Styles ===================== */
* { margin:0; padding:0; box-sizing:border-box; font-family: Arial, sans-serif; }

body {
    background: linear-gradient(to bottom right, #7AC7D5, #F0E5DE);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
}

/* ===================== Navbar ===================== */
nav {
    display:flex;
    justify-content: space-between;
    align-items:center;
    padding:20px 50px;
    color:white;
    background: rgba(0,0,0,0.2);
}

nav .logo { font-weight:bold; font-size:24px; }
nav ul { list-style:none; display:flex; gap:30px; }
nav ul li a { text-decoration:none; color:white; font-weight:500; }
nav .signout-btn {
    background:white; color:#333; padding:8px 20px; border-radius:25px; text-decoration:none; font-weight:bold;
}

/* ===================== Hero Section ===================== */
.hero {
    display:flex;
    justify-content:space-around;
    align-items:center;
    padding:50px;
    flex-wrap: wrap;
}

.hero-text {
    max-width:500px;
    color:white;
}

.hero-text h1 { font-size:48px; margin-bottom:20px; }
.hero-text p { font-size:18px; margin-bottom:30px; }
.hero-text .btn {
    background-color:#F2C2A9;
    color:#333;
    padding:12px 30px;
    border-radius:25px;
    text-decoration:none;
    font-weight:bold;
    transition: all 0.3s;
}
.hero-text .btn:hover { background-color:#eabf9f; }

.hero-img img { max-width:400px; height:auto; }

/* ===================== Users Table ===================== */
table {
    width:90%;
    margin: 20px auto 50px;
    border-collapse: collapse;
    background:white;
    border-radius:10px;
    overflow:hidden;
}

th, td {
    padding:12px;
    border-bottom:1px solid #ccc;
    text-align:left;
}

th { background-color:#7AC7D5; color:white; }

@media(max-width:900px){
    .hero { flex-direction:column-reverse; text-align:center; gap:30px; padding:20px; }
    .hero-text h1 { font-size:36px; }
    .hero-text p { font-size:16px; }
    .hero-img img { max-width:300px; }
    nav { padding:20px 30px; }
}
</style>
</head>
<body>

<!-- Navbar -->
<nav>
    <div class="logo">Vehicle Accident Alert System</div>
    <ul>
        <li><a href="#">ABOUT US</a></li>
        <li><a href="#">COURSES</a></li>
        <li><a href="#">REVIEWS</a></li>
    </ul>
    <a href="login.html" class="signout-btn">LOG OUT</a>
</nav>

<!-- Hero Section -->
<section class="hero">
    <div class="hero-text">
        <h1>Your reliable access to safety drive is here</h1>
        <p>Start your journey with us.</p>
        <a href="sign.html" class="btn">Add New User</a>
    </div>
    <div class="hero-img">
        <img src="3244682-removebg-preview.png" alt="Illustration">
    </div>
</section>

<!-- Users Table -->
<h2 style="text-align:center; color:#333;">Registered Users</h2>
<table>
    <thead>
        <tr>
            <th>ID</th>
            <th>Full Name</th>
            <th>Contact Number</th>
            <th>Email</th>
            <th>Username</th>
        </tr>
    </thead>
    <tbody id="userTableBody"></tbody>
</table>

<!-- Supabase -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const supabase = supabase.createClient(
  "https://qfbnqzkfibvqqodohdkq.supabase.co",
  "sb_publishable_5iqwo3kLms7Y9HuTIDwbwA_j1TENl8x"
);

// Load all users from Supabase
async function loadUsers() {
    const { data, error } = await supabase.from("users").select("*").order("id", {ascending:true});
    const tbody = document.getElementById("userTableBody");
    tbody.innerHTML = "";

    if(error){
        console.error(error);
        alert("Failed to load users from database");
        return;
    }

    data.forEach(u => {
        const tr = document.createElement("tr");
        tr.innerHTML = `
            <td>${u.id}</td>
            <td>${u.full_name}</td>
            <td>${u.contact_number}</td>
            <td>${u.email}</td>
            <td>${u.username}</td>
        `;
        tbody.appendChild(tr);
    });
}

// Call loadUsers on page load
loadUsers();
</script>

</body>
</html>
