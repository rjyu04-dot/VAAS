<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Dashboard</title>
<style>
body { font-family: Arial; background: linear-gradient(to bottom right, #7AC7D5,#F0E5DE); margin:0;}
nav { display:flex; justify-content:space-between; align-items:center; padding:20px 50px; color:white;}
nav .logo{ font-weight:bold; font-size:24px;}
nav ul{ list-style:none; display:flex; gap:30px;}
nav ul li a{ text-decoration:none; color:white;}
nav .signin-btn{ background:white; color:#333; padding:8px 20px; border-radius:25px; text-decoration:none; font-weight:bold;}
.hero{ display:flex; justify-content:space-around; align-items:center; padding:0 50px;}
.hero-text{ max-width:500px; color:white;}
.hero-text h1{ font-size:48px; margin-bottom:20px;}
.hero-text p{ font-size:18px; margin-bottom:30px;}
.hero-text .btn{ background-color:#F2C2A9; color:#333; padding:12px 30px; border-radius:25px; text-decoration:none; font-weight:bold;}
.hero-img img{ max-width:400px; height:auto;}
table{ width:100%; border-collapse:collapse; margin-top:20px; background:white;}
th,td{ padding:10px; border:1px solid #ccc; text-align:left;}
</style>
</head>
<body>
<nav>
<div class="logo">Vehicle Accident Alert System</div>
<ul>
<li><a href="#">ABOUT US</a></li>
<li><a href="#">COURSES</a></li>
<li><a href="#">REVIEWS</a></li>
</ul>
<a href="login.html" class="signin-btn">LOG OUT</a>
</nav>

<section class="hero">
<div class="hero-text">
<h1>Your reliable access to safety drive is here</h1>
<p>Start your journey with us.</p>
<a href="sign.html" class="btn">Add New User</a>
</div>
<div class="hero-img">
<img src="3244682-removebg-preview.png" alt="Illustration">
</div>
</section>

<h2 style="text-align:center;">Users</h2>
<table>
<thead>
<tr><th>ID</th><th>Full Name</th><th>Contact</th><th>Email</th><th>Username</th></tr>
</thead>
<tbody id="userTableBody"></tbody>
</table>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const supabase = supabase.createClient(
  "https://qfbnqzkfibvqqodohdkq.supabase.co",
  "sb_publishable_5iqwo3kLms7Y9HuTIDwbwA_j1TENl8x"
);

async function loadUsers(){
    const { data, error } = await supabase.from("users").select("*");
    const tbody = document.getElementById("userTableBody");
    tbody.innerHTML = "";
    if(error){
        console.error(error);
        return;
    }
    data.forEach(u=>{
        const tr = document.createElement("tr");
        tr.innerHTML = `<td>${u.id}</td><td>${u.full_name}</td><td>${u.contact_number}</td><td>${u.email}</td><td>${u.username}</td>`;
        tbody.appendChild(tr);
    });
}

loadUsers();
</script>
</body>
</html>
