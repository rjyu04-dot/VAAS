<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Dashboard</title>
<style>
/* ===================== Reset & Base Styles ===================== */
* { margin:0; padding:0; box-sizing:border-box; font-family: Arial, sans-serif; }

body {
    background: linear-gradient(to bottom right, #7AC7D5, #F0E5DE);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
}

/* ===================== Navbar ===================== */
nav {
    display:flex;
    justify-content: space-between;
    align-items:center;
    padding:20px 50px;
    color:white;
    background: rgba(0,0,0,0.2);
}

nav .logo { font-weight:bold; font-size:24px; }
nav ul { list-style:none; display:flex; gap:30px; }
nav ul li a { text-decoration:none; color:white; font-weight:500; }
nav .signout-btn {
    background:white; color:#333; padding:8px 20px; border-radius:25px; text-decoration:none; font-weight:bold;
}

/* ===================== Hero Section ===================== */
.hero {
    display:flex;
    justify-content:space-around;
    align-items:center;
    padding:50px;
    flex-wrap: wrap;
}

.hero-text {
    max-width:500px;
    color:white;
}

.hero-text h1 { font-size:48px; margin-bottom:20px; }
.hero-text p { font-size:18px; margin-bottom:30px; }
.hero-text .btn {
    background-color:#F2C2A9;
    color:#333;
    padding:12px 30px;
    border-radius:25px;
    text-decoration:none;
    font-weight:bold;
    transition: all 0.3s;
}
.hero-text .btn:hover { background-color:#eabf9f; }

.hero-img img { max-width:400px; height:auto; }

/* ===================== Users Table ===================== */
table {
    width:90%;
    margin: 20px auto 50px;
    border-collapse: collapse;
    background:white;
    border-radius:10px;
    overflow:hidden;
}

th, td {
    padding:12px;
    border-bottom:1px solid #ccc;
    text-align:left;
}

th { background-color:#7AC7D5; color:white; }

@media(max-width:900px){
    .hero { flex-direction:column-reverse; text-align:center; gap:30px; padding:20px; }
    .hero-text h1 { font-size:36px; }
    .hero-text p { font-size:16px; }
    .hero-img img { max-width:300px; }
    nav { padding:20px 30px; }
}
</style>
</head>
<body>

<!-- Navbar -->
<nav>
    <div class="logo">Vehicle Accident Alert System</div>
    <ul>
        <li><a href="#">ABOUT US</a></li>
        <li><a href="#">COURSES</a></li>
        <li><a href="#">REVIEWS</a></li>
    </ul>
    <a href="index.html" class="signout-btn">LOG OUT</a>
</nav>

<!-- Hero Section -->
<section class="hero">
    <div class="hero-text">
        <h1>Your reliable access to safety drive is here</h1>
        <p>Start your journey with us.</p>
        <a href="sign.html" class="btn">Add New User</a>
    </div>
    <div class="hero-img">
        <img src="3244682-removebg-preview.png" alt="Illustration">
    </div>
</section>

<!-- Users Table -->
<h2 style="text-align:center; color:#333;">Registered Users</h2>
<table>
    <thead>
        <tr>
            <th>ID</th>
            <th>Full Name</th>
            <th>Contact Number</th>
            <th>Email</th>
            <th>Username</th>
        </tr>
    </thead>
    <tbody id="userTableBody"></tbody>
</table>

<!-- Supabase -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script>
const supabaseClient = supabase.createClient(
  "https://qfbnqzkfibvqqodohdkq.supabase.co",
  "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InFmYm5xemtmaWJ2cXFvZG9oZGtxIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzE3NjAzNjksImV4cCI6MjA4NzMzNjM2OX0.PueBvyIVntROUi36LGEGNR3_Y3fEvI30kcBnuSIn59o"
);

async function loadProfile() {
    const userId = localStorage.getItem("user_id");
    if (!userId) {
        window.location.href = "index.html";
        return;
    }

    const { data: profile, error } = await supabaseClient.from("profiles")
        .select("*")
        .eq("id", userId)
        .single();

    if (error) {
        alert(error.message);
        return;
    }

    document.getElementById("welcomeText").innerText = `Hello, ${profile.full_name} (Username: ${profile.username})`;
}

document.getElementById("signout-btn").addEventListener("click", async () => {
    alert("Thank you for using.");
    await supabaseClient.auth.signOut();
    localStorage.removeItem("user_id");
    window.location.href = "index.html";
});

loadProfile();
</script>

</body>
</html>
