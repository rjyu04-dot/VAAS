
<head>
    <title>Sign-Up</title>
    <style>
        @keyframes fadeIn {
            0% { opacity: 0; transform: translateX(-300px); } /* start invisible and slightly up */
            100% { opacity: 1; transform: translateY(0); }   /* fully visible at normal position */
        }
        body{
            font-family: Arial;
            background: url("uwp4981789.jpeg") no-repeat center center fixed;
            background-position: center;
            background-repeat: no-repeat;
            background-size: cover;   /* makes it full screen */
            background-attachment: fixed; /* optional: makes it stay when scrolling */
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }
        .container input {
            width: 100%;
            padding: 10px;
            margin: 10px 0;
            border: none;
            border-radius: 5px;
        }
        .container {
            width: 95%;
            max-width: 400px;
            padding: 20px;
            background: rgba(41, 40, 40, 0.3);
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1); /* correct box-shadow syntax */
            box-sizing: border-box; /* makes padding included in width */
            text-align: center; /* centers text inside container */
            /* animation properties */
            animation: fadeIn 1s ease-in-out; /* name duration easing */
        }
    </style>
</head>
<body>
    <div class="container">
        <h1 style="text-align: center; color: white; font-size: 32px;">SIGN-UP</h1>
        <h2 style="text-align:center"></h2>
        <form method="POST">
        
        <input type="text" name="fn" placeholder="Enter your Full Name" id="txtfn" required>
        <br>
        <input type="text" name="cn" placeholder="Enter your Contact Number" id="txtcn" required>
        <br>
        <input type="text" name="email" placeholder="Enter your Email Address" id="txtemail" required>
        <br>
        <input type="text" name="Username" placeholder="Enter your Username" id="txtfn" required>
        <br>
        <input type="password" name="password" placeholder="Enter your Password" id="txtpass" required>
        <br><br><br>
        <input type="submit" value="SUBMIT" placeholder="Enter" id="enter">
        <br>
        <input type="reset" value="CANCEL" placeholder="Cancel" id="cancel">
        <br><br>
        <a href="index.html" style="
            background-color: rgba(8, 4, 247, 0.137);
            color: white;       /* text color */
            font-size: 18px;      /* font size */
            font-weight: Arial;    /* bold text */
            text-decoration: none; /* remove underline */">
            Create your Account Here.
        </a>
        </form>
    </div>
</body>
</html>

<script>
    // Example credentials (for demo purposes)
    const validUsers = [
        { username: "testuser", password: "1234" },
        { username: "admin", password: "admin" }
    ];

    // Get the form element
    const form = document.querySelector("form");

    form.addEventListener("submit", function(e) {
        e.preventDefault(); // Prevent form from submitting normally

        // Get user inputs
        const username = document.querySelector('input[name="Username"]').value;
        const password = document.querySelector('input[name="password"]').value;

        // Check if user exists in validUsers
        const user = validUsers.find(u => u.username === username && u.password === password);

        if (user) {
            // Correct credentials → redirect to index.html
            alert("Login successful! Redirecting...");
            window.location.href = "dashboard.html";
        } else {
            // Wrong credentials → show alert
            alert("Invalid username or password. Please try again.");
        }
    });
</script>
