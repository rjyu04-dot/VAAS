<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Sign-Up</title>
<style>
body { font-family: Arial; background: url("uwp4981789.jpeg") no-repeat center center fixed; background-size: cover; display:flex; justify-content:center; align-items:center; height:100vh; margin:0;}
.container { width: 95%; max-width: 400px; padding: 20px; background: rgba(41,40,40,0.3); border-radius:10px; text-align:center;}
.container input { width:100%; padding:10px; margin:10px 0; border-radius:5px; border:none;}
.container a { display:inline-block; margin-top:10px; background-color: rgba(8,4,247,0.137); color:white; text-decoration:none; padding:5px 10px; border-radius:5px;}
</style>
</head>
<body>
<div class="container">
<h1 style="color:white;">SIGN-UP</h1>
<form id="signupForm">
<input type="text" id="fn" placeholder="Full Name" required>
<input type="text" id="cn" placeholder="Contact Number" required>
<input type="email" id="email" placeholder="Email" required>
<input type="text" id="username" placeholder="Username" required>
<input type="password" id="password" placeholder="Password" required>
<input type="submit" value="Sign Up">
<input type="reset" value="CANCEL">
</form>
<a href="login.html">Already have an account? Login Here</a>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const supabase = supabase.createClient(
  "https://qfbnqzkfibvqqodohdkq.supabase.co",
  "sb_publishable_5iqwo3kLms7Y9HuTIDwbwA_j1TENl8x"
);

document.getElementById("signupForm").addEventListener("submit", async (e)=>{
    e.preventDefault(); // prevents refresh

    const fn = document.getElementById("fn").value.trim();
    const cn = document.getElementById("cn").value.trim();
    const email = document.getElementById("email").value.trim();
    const username = document.getElementById("username").value.trim();
    const password = document.getElementById("password").value.trim();

    if(!fn || !cn || !email || !username || !password){
        alert("All fields are required");
        return;
    }

    // Check duplicate username
    const { data: existing, error: checkError } = await supabase
        .from("users")
        .select("username")
        .eq("username", username);

    if(checkError){
        console.error(checkError);
        alert("Error checking username");
        return;
    }

    if(existing.length > 0){
        alert("Username already exists!");
        return;
    }

    // Insert user
    const { error: insertError } = await supabase
        .from("users")
        .insert([{ full_name: fn, contact_number: cn, email, username, password }]);

    if(insertError){
        console.error(insertError);
        alert("Sign-up failed");
    } else {
        alert("Signup successful!");
        window.location.href = "login.html";
    }
});
</script>
</body>
</html>
