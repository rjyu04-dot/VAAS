<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Sign-Up</title>
    <style>
        @keyframes fadeIn {
            0% { opacity: 0; transform: translateX(-300px); }
            100% { opacity: 1; transform: translateY(0); }
        }
        body {
            font-family: Arial;
            background: url("uwp4981789.jpeg") no-repeat center center fixed;
            background-size: cover;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }
        .container {
            width: 95%;
            max-width: 400px;
            padding: 20px;
            background: rgba(41, 40, 40, 0.3);
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
            box-sizing: border-box;
            text-align: center;
            animation: fadeIn 1s ease-in-out;
        }
        .container input {
            width: 100%;
            padding: 10px;
            margin: 10px 0;
            border: none;
            border-radius: 5px;
        }
        .container a {
            display: inline-block;
            margin-top: 10px;
            background-color: rgba(8, 4, 247, 0.137);
            color: white;
            font-size: 18px;
            text-decoration: none;
            padding: 5px 10px;
            border-radius: 5px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1 style="color: white; font-size: 32px;">SIGN-UP</h1>
        <form id="signupForm">
            <input type="text" name="fn" placeholder="Full Name" required>
            <input type="text" name="cn" placeholder="Contact Number" required>
            <input type="text" name="email" placeholder="Email Address" required>
            <input type="text" name="Username" placeholder="Username" required>
            <input type="password" name="password" placeholder="Password" required>
            <input type="submit" value="SUBMIT">
            <input type="reset" value="CANCEL">
        </form>
        <a href="index.html">Already have an account? Login Here</a>
    </div>

   <script>
document.getElementById('signupForm').addEventListener('submit', async (e) => {
  e.preventDefault();

  const formData = {
    fn: e.target.fn.value.trim(),
    cn: e.target.cn.value.trim(),
    email: e.target.email.value.trim(),
    Username: e.target.Username.value.trim(),
    password: e.target.password.value.trim()
  };

  try {
    // Use relative path so it works when served via Node
    const response = await fetch('/signup', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(formData)
    });

    // Parse JSON even if response status is 4xx or 5xx
    const result = await response.json();

    // Show server message instead of generic error
    alert(result.message);

    // Redirect only if success
    if (result.success) window.location.href = 'index.html';

  } catch (err) {
    // Only log unexpected fetch/network errors
    console.error('Unexpected error:', err);
    alert('Unexpected error connecting to the server. Please try again.');
  }
});
</script>
</body>
</html>
