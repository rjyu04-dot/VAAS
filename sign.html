<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Sign-Up</title>
    <style>
        @keyframes fadeIn {
            0% { opacity: 0; transform: translateX(-300px); }
            100% { opacity: 1; transform: translateY(0); }
        }
        body {
            font-family: Arial;
            background: url("uwp4981789.jpeg") no-repeat center center fixed;
            background-size: cover;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }
        .container {
            width: 95%;
            max-width: 400px;
            padding: 20px;
            background: rgba(41, 40, 40, 0.3);
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
            box-sizing: border-box;
            text-align: center;
            animation: fadeIn 1s ease-in-out;
        }
        .container input {
            width: 100%;
            padding: 10px;
            margin: 10px 0;
            border: none;
            border-radius: 5px;
        }
        .container a {
            display: inline-block;
            margin-top: 10px;
            background-color: rgba(8, 4, 247, 0.137);
            color: white;
            font-size: 18px;
            text-decoration: none;
            padding: 5px 10px;
            border-radius: 5px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1 style="color: white; font-size: 32px;">SIGN-UP</h1>
       <form id="signupForm">
            <input type="text" id="fn" placeholder="Full Name" required>
            <input type="text" id="cn" placeholder="Contact Number" required>
            <input type="email" id="email" placeholder="Email Address" required>
            <input type="text" id="username" placeholder="Username" required>
            <input type="password" id="password" placeholder="Password" required>
            <input type="submit" value="Sign Up">
            <input type="reset" value="CANCEL">
        </form>
        <a href="index.html">Already have an account? Login Here</a>
    </div>

   <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const supabaseClient = supabase.createClient(
  "https://qfbnqzkfibvqqodohdkq.supabase.co",
  "sb_publishable_5iqwo3kLms7Y9HuTIDwbwA_j1TENl8x"
);

document.getElementById("signupForm").addEventListener("submit", async (e) => {
  e.preventDefault();

  const fn = document.getElementById("fn").value;
  const cn = document.getElementById("cn").value;
  const email = document.getElementById("email").value;
  const username = document.getElementById("username").value;
  const password = document.getElementById("password").value;

  const { data, error } = await supabaseClient
    .from("users")
    .insert([
      {
        full_name: fn,
        contact_number: cn,
        email: email,
        username: username,
        password: password
      }
    ]);

  if (error) {
    console.log(error);
    alert("Signup failed");
  } else {
    alert("Signup successful!");
    window.location.href = "index.html";
  }
});
</script>
</body>
</html>
