<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Sign-Up</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; font-family: Arial, sans-serif; }

body {
    background: linear-gradient(to bottom right, #7AC7D5, #F0E5DE);
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
}

.container {
    width: 95%;
    max-width: 400px;
    padding: 20px;
    background: rgba(255,255,255,0.15);
    border-radius: 10px;
    box-shadow: 0 0 15px rgba(0,0,0,0.2);
    text-align: center;
}

.container h1 { color:white; font-size:32px; margin-bottom:20px; }

.container input {
    width:100%;
    padding:10px;
    margin:10px 0;
    border:none;
    border-radius:5px;
}

.container input[type="submit"], .container input[type="reset"] {
    cursor:pointer;
    font-weight:bold;
}

.container a {
    display:inline-block;
    margin-top:10px;
    background-color: rgba(8,4,247,0.137);
    color:white;
    font-size:18px;
    text-decoration:none;
    padding:5px 10px;
    border-radius:5px;
}
</style>
</head>
<body>
<div class="container">
    <h1>SIGN-UP</h1>
    <form id="signupForm">
        <input type="text" id="fn" placeholder="Full Name" required>
        <input type="text" id="cn" placeholder="Contact Number" required>
        <input type="email" id="email" placeholder="Email Address" required>
        <input type="text" id="username" placeholder="Username" required>
        <input type="password" id="password" placeholder="Password" required>
        <input type="submit" value="Sign Up">
        <input type="reset" value="CANCEL">
    </form>
    <a href="index.html">Already have an account? Login Here</a>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script>
const supabaseClient = supabase.createClient(
  "https://qfbnqzkfibvqqodohdkq.supabase.co",
  "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InFmYm5xemtmaWJ2cXFvZG9oZGtxIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzE3NjAzNjksImV4cCI6MjA4NzMzNjM2OX0.PueBvyIVntROUi36LGEGNR3_Y3fEvI30kcBnuSIn59o"
);

document.getElementById("signupForm").addEventListener("submit", async e => {
    e.preventDefault();

    const fn = document.getElementById("fn").value;
    const cn = document.getElementById("cn").value;
    const username = document.getElementById("username").value;
    const email = document.getElementById("email").value;
    const password = document.getElementById("password").value;

    // Step 1: Create Auth user
    const { data, error } = await supabaseClient.auth.signUp({ email, password });

    if (error) {
        alert(error.message);
        return;
    }

    const user = data.user;

    // Step 2: Insert profile
    const { error: profileError } = await supabaseClient.from("profiles").insert([
        { id: user.id, full_name: fn, contact_number: cn, username: username }
    ]);

    if (profileError) {
        alert(profileError.message);
        return;
    }

    alert("Signup successful! You can now login.");
    window.location.href = "index.html";
});
</script>
</body>
</html>
