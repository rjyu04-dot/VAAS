<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Login</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; font-family: Arial, sans-serif; }

body {
    background: linear-gradient(to bottom right, #7AC7D5, #F0E5DE);
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
}

.container {
    width: 95%;
    max-width: 400px;
    padding: 20px;
    background: rgba(255,255,255,0.15);
    border-radius: 10px;
    box-shadow: 0 0 15px rgba(0,0,0,0.2);
    text-align: center;
}

.container h1 { color:white; font-size:32px; margin-bottom:20px; }

.container input {
    width:100%;
    padding:10px;
    margin:10px 0;
    border:none;
    border-radius:5px;
}

.container input[type="submit"], .container input[type="reset"] {
    cursor:pointer;
    font-weight:bold;
}

.container a {
    display:inline-block;
    margin-top:10px;
    background-color: rgba(8,4,247,0.137);
    color:white;
    font-size:18px;
    text-decoration:none;
    padding:5px 10px;
    border-radius:5px;
}
</style>
</head>
<body>
<div class="container">
    <h1>LOG-IN</h1>
    <form id="loginForm">
        <input type="text" id="username" placeholder="Username" required>
        <input type="password" id="password" placeholder="Password" required>
        <input type="submit" value="SUBMIT">
        <input type="reset" value="CANCEL">
    </form>
    <a href="sign.html">Create a new account</a>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script>
const supabaseClient = supabase.createClient(
  "https://qfbnqzkfibvqqodohdkq.supabase.co",
  "sb_publishable_5iqwo3kLms7Y9HuTIDwbwA_j1TENl8x"
);

document.getElementById("loginForm").addEventListener("submit", async e => {
    e.preventDefault();

    const email = document.getElementById("username").value; // now use email
    const password = document.getElementById("password").value;

    const { data, error } = await supabaseClient.auth.signInWithPassword({
        email: email,
        password: password
    });

    if (error) {
        alert(error.message);
    } else {
        alert("Login successful!");
        window.location.href = "dashboard.html";
    }
});
</script>
</body>
</html>
